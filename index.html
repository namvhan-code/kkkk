<!-- ส่วนเพิ่ม: ช่อง Note สำหรับคัดลอกข้อความ -->
<div class="note-section">
    <p>โน้ตสำหรับแนบสลิป:</p>
    <div class="copy-box" style="border: 1px dashed #ccc; padding: 10px; display: flex; justify-content: space-between; align-items: center;">
        <span id="copyText">ซื้อขายกับร้านลมหนาว</span>
        <button onclick="copyToClipboard()" style="cursor: pointer;">คัดลอก</button>
    </div>
</div>

<script>
function copyToClipboard() {
    const text = document.getElementById("copyText").innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("คัดลอกข้อความเรียบร้อยแล้ว");
    });
}
</script>
